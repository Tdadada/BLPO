[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blpo"
version = "0.1.0"
description = "Beyond-Local Policy Optimization for long-horizon LLM agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
audit = ["pyarrow>=14"]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["blpo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
